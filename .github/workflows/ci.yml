name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analizar-y-probar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión del SDK
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      # Informativo: un desajuste de formato no debería frenar la revisión.
      - name: Formato
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  prueba-total-api:
    name: Prueba total de la API (simulador)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Simulador y prueba total
        run: |
          python tool/api_mock_server.py 8765 &
          sleep 1
          python tool/api_full_test.py --base-url=http://127.0.0.1:8765 \
            --phone=+5215500000000 --otp=123456 --create-yonke
